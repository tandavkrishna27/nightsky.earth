name: NightSky Claude package

on:
  push:
    branches: [codex/plugin-v1, main]
    paths:
      - plugins/nightsky-claude/**
      - scripts/verify-claude-package.mjs
      - .github/workflows/nightsky-claude-package.yml
  pull_request:
    paths:
      - plugins/nightsky-claude/**
      - scripts/verify-claude-package.mjs
      - .github/workflows/nightsky-claude-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check Claude package boundaries
        run: node scripts/verify-claude-package.mjs
      - name: Validate Claude manifest and skills
        run: npx --yes @anthropic-ai/claude-code@2.1.308 plugin validate ./plugins/nightsky-claude
