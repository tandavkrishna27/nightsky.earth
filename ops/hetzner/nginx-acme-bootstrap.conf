# Temporary HTTP-only preparation: no application proxy, no missing certificates.
# Install only after checking existing server_name/listen conflicts.
server {
    listen 80;
    server_name mcp.nightsky.earth mcp-staging.nightsky.earth;
    access_log off;
    error_log /dev/null;
    client_header_timeout 15s;
    client_body_timeout 15s;
    client_max_body_size 32k;
    location ^~ /.well-known/acme-challenge/ {
        limit_except GET { deny all; }
        root /var/www/nightsky-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 403; }
}
