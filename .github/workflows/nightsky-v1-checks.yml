name: NightSky V1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightsky-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Exercise bounded global discovery and exact selected-site planning offline
        run: node --import tsx --test tests/mcp/global-discovery.test.ts

      - name: Check TypeScript
        run: npm run check

      - name: Check indexed queries against a 100000-row offline reference
        run: node --max-old-space-size=512 --import tsx scripts/osm/benchmark_shards.ts

      - name: Build and lint local plugin rehearsal package
        run: npm run plugin:package

      - name: Verify complete Codex and Claude local packages offline
        run: node --import tsx scripts/verify-local-plugin-packages.ts

      - name: Exercise all eight review cases through local MCP
        run: npm run test:review-cases

      - name: Build website and MCP service
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Start and exercise built service
        run: node scripts/verify-production-runtime.mjs

      - name: Exercise standalone plugin production runtime
        run: node scripts/verify-plugin-runtime.mjs

      - name: Exercise compiled regional serving and operator configuration offline
        run: node scripts/verify-plugin-regional-runtime.mjs

  osm-importer:
    name: OSM importer tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned importer dependency
        run: python -m pip install -r scripts/osm/requirements.txt

      - name: Install OSM XML runtime library
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libexpat1

      - name: Run OSM importer and offline spot runner tests
        run: python -m unittest discover -s tests/osm -v

      - name: Validate the offline pinned spot plan CLI
        run: python scripts/osm/spot_runner.py plan

  era5-decoder:
    name: ERA5 offline decoder, downloader and pilot tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned data and transport dependencies
        run: python -m pip install -r scripts/era5/requirements.txt -r scripts/era5/download-requirements.txt
      - name: Run ERA5 fixtures without account or source requests
        run: python -m unittest discover -s tests/era5 -v
