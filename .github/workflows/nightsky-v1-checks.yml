name: NightSky V1 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightsky-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python for cross-language source contracts
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci

      - name: Run offline suite including bounded lineage and source admission fixtures
        run: npm test

      - name: Test restricted Hetzner release and rollback offline
        run: python -m unittest discover -s tests/deployment -p test_hetzner_release.py -v

      - name: Exercise bounded global discovery and exact selected-site planning offline
        run: node --import tsx --test tests/mcp/global-discovery.test.ts

      - name: Exercise synthetic three-source weather and partial outage contracts
        run: node --import tsx --test tests/mcp/multi-weather-planning.test.ts tests/providers/weather-collection.test.ts tests/skills/multi-weather-workflows.test.ts

      - name: Exercise optional sky sources and MCP contracts without credentials
        run: node --import tsx --test tests/providers/sevenTimer.test.ts tests/providers/sevenTimer-migration.test.ts tests/operations/sky-live-probe.test.ts tests/operations/sky-continuation-probe.test.ts tests/operations/native-bounded-session.test.ts tests/mcp/complete-optional-journeys.test.ts tests/providers/sky/sky.test.ts tests/providers/space/space.test.ts tests/providers/source-cache.test.ts tests/mcp/optional-sky-tools.test.ts tests/nightsky/sevenTimer-planner.test.ts tests/operations/sky-quota-setup.test.ts tests/skills/optional-sky-workflows.test.ts

      - name: Verify sky diagnostic defaults to a no-network proposal
        run: node --import tsx scripts/validate-sky-live.ts --plan

      - name: Exercise light pollution contracts, API, worker, workflows and bounded pilot offline
        run: node --import tsx --test tests/providers/light-pollution-contract.test.ts tests/providers/darkskysites.test.ts tests/providers/light-pollution-browser.test.ts tests/providers/darkskysites-browser.test.ts tests/mcp/light-pollution-journeys.test.ts tests/skills/light-pollution-workflows.test.ts tests/operations/light-pollution-validation.test.ts

      - name: Exercise host-aware outings and timestamped orientation offline
        run: node --import tsx --test tests/skills/host-aware-outing.test.ts tests/skills/conversation-acceptance.test.ts tests/nightsky/astronomy.test.ts tests/mcp/answer-text.test.ts tests/mcp/forecast-answer-text.test.ts

      - name: Exercise optional Public Universe contracts and default isolation offline
        run: node --import tsx --test tests/providers/public-universe-contracts.test.ts tests/providers/public-universe-transport.test.ts tests/providers/public-universe-store.test.ts tests/providers/public-universe-deadlines.test.ts tests/providers/public-universe-date-query.test.ts tests/providers/public-universe-meteor-evidence.test.ts tests/providers/public-universe-starter-evidence.test.ts tests/providers/public-universe-provider.test.ts tests/providers/public-universe-configuration.test.ts tests/mcp/public-universe-tools.test.ts tests/skills/public-universe-workflows.test.ts

      - name: Exercise native protocol budgets and redacted request diagnostics offline
        run: node --import tsx --test tests/mcp/native-admission.test.ts tests/mcp/local-proxy.test.ts tests/mcp/route-body.test.ts

      - name: Verify Public Universe allocation preparation makes no requests or writes
        run: node --import tsx scripts/initialize-public-universe-quota.ts --plan

      - name: Verify light pollution pilot defaults to a no-network proposal
        run: node --import tsx scripts/validate-light-pollution.ts --plan

      - name: Measure API fixture runtime without live source access
        run: node --import tsx scripts/measure-api-runtime.ts

      - name: Measure bounded offline concurrency and provider failures
        run: node --import tsx scripts/measure-api-load.ts

      - name: Verify offline operator template stays explicitly incomplete
        run: node --import tsx --input-type=module -e "import {operatorPreflightCli} from './scripts/plugin-operator-preflight.ts'; if(await operatorPreflightCli(['--config','config/plugin-operator.example.json'])!==2) throw Error('Template must stay incomplete');"

      - name: Check TypeScript
        run: npm run check

      - name: Check indexed queries against a 100000-row offline reference
        run: node --max-old-space-size=512 --import tsx scripts/osm/benchmark_shards.ts

      - name: Build and lint local plugin rehearsal package
        run: npm run plugin:package

      - name: Verify complete Codex and Claude local packages offline
        run: node --import tsx scripts/verify-local-plugin-packages.ts

      - name: Prepare complete Codex API fixture package and verify loopback binding
        run: node --import tsx scripts/prepare-codex-local-fixture.ts --port 0 --out dist/codex-fixture-ci

      - name: Verify history accounting operator defaults to offline planning
        run: node --import tsx scripts/era5/history-accounting-operator.ts

      - name: Exercise all eight review cases through local MCP
        run: npm run test:review-cases

      - name: Exercise all eight review cases through API fixture selection
        run: node --import tsx scripts/verify-review-cases.ts --offline --api-fixture --out dist/api-review-rehearsal

      - name: Build website and MCP service
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev --omit=optional

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Start and exercise built service
        run: node scripts/verify-production-runtime.mjs

      - name: Exercise standalone plugin production runtime
        run: node scripts/verify-plugin-runtime.mjs

      - name: Measure bounded compiled API concurrency without local geography or live providers
        run: node scripts/verify-api-runtime.mjs --capacity

      - name: Exercise compiled optional Public Universe inventory with external requests forbidden
        run: node scripts/verify-public-universe-runtime.mjs

      - name: Exercise compiled light pollution API and blocked worker without optional Playwright
        run: node scripts/verify-light-pollution-runtime.mjs --require-no-playwright

      - name: Exercise compiled regional serving and operator configuration offline
        run: node scripts/verify-plugin-regional-runtime.mjs

  osm-importer:
    name: OSM importer tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned importer dependency
        run: python -m pip install -r scripts/osm/requirements.txt

      - name: Set up Node.js for raw-source to catalogue integration
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked catalogue bridge dependencies
        run: npm ci

      - name: Install OSM XML runtime library
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libexpat1

      - name: Run OSM importer and offline spot runner tests
        run: python -m unittest discover -s tests/osm -v

      - name: Validate the offline pinned spot plan CLI
        run: python scripts/osm/spot_runner.py plan

      - name: Verify fixed geography acquisition defaults to an offline plan
        run: python scripts/osm/natural_earth_acquire.py

  era5-decoder:
    name: ERA5 offline decoder, downloader and pilot tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned data and transport dependencies
        run: python -m pip install -r scripts/era5/requirements.txt -r scripts/era5/download-requirements.txt
      - name: Verify deferred sample entry point remains offline by default
        run: python scripts/era5/sample_live.py --plan
      - name: Verify time-series entry point stays offline and plan-only
        run: python scripts/era5/timeseries_executor.py --plan
      - name: Verify gated time-series sample defaults to an offline plan
        run: python scripts/era5/timeseries_sample.py --plan
      - name: Verify global acquisition defaults to an offline plan
        run: python scripts/era5/global_acquisition.py --plan
      - name: Run ERA5 fixtures without account or source requests
        run: python -m unittest discover -s tests/era5 -v
