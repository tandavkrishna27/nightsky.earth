# Staging must also have operator configured access restriction before exposure.
server {
    access_log off;
    error_log /dev/null;
    client_header_timeout 15s;
    client_body_timeout 15s;
    listen 443 ssl;
    server_name mcp-staging.nightsky.earth;
    ssl_certificate /etc/letsencrypt/live/mcp-staging.nightsky.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-staging.nightsky.earth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        deny all;
        proxy_pass http://172.30.81.2:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
server {
    access_log off;
    error_log /dev/null;
    client_header_timeout 15s;
    client_body_timeout 15s;
    listen 80;
    server_name mcp-staging.nightsky.earth;
    return 308 https://mcp-staging.nightsky.earth$request_uri;
}
