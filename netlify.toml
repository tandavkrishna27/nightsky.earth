# Netlify Configuration for NightSky.earth

[build]
  # Build command
  # Publication build: fails closed until required factual approvals are recorded.
  command = "npm run build:release"
  
  # Directory to publish (output of Vite build)
  publish = "dist/public"
  
  # Node version
  [build.environment]
    NODE_VERSION = "20"

# The verified public ChatGPT directory entry. Keep this in both production
# and previews so the install path can be reviewed before release.
[context.production.environment]
  VITE_NIGHTSKY_LISTING_PUBLISHED = "true"
  VITE_NIGHTSKY_LISTING_URL = "https://chatgpt.com/plugins/plugin_asdk_app_6ad9e640386481918ec734bb4d616193"

[context.deploy-preview.environment]
  VITE_NIGHTSKY_LISTING_PUBLISHED = "true"
  VITE_NIGHTSKY_LISTING_URL = "https://chatgpt.com/plugins/plugin_asdk_app_6ad9e640386481918ec734bb4d616193"

# Review and branch previews use the no-index preview build. Production keeps
# the release build above, which stops until required factual approvals exist.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Redirect rules for Single Page Application
[functions]
  directory = "netlify/functions"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 1 year
[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS and JS for 1 year
[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts for 1 year
[[headers]]
  for = "/**/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
